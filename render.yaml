services:
  - type: web
    name: omnitask-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BEAT_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: VERCEL_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
